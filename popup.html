<!DOCTYPE html>
<html>
<head>
  <title>GlobalNoteTA Options</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 10px; width: 300px; }
    label { display: block; margin: 10px 0; }
    select, button { padding: 5px; }
  </style>
</head>
<body>
  <h3>GlobalNoteTA Settings</h3>
  <label>
    <input type="checkbox" id="global-enable"> Enable conversion globally
  </label>
  <label>
    Default Variant:
    <select id="default-variant">
      <option value="zh-cn">Simplified (China)</option>
      <option value="zh-tw">Traditional (Taiwan)</option>
      <option value="zh-hk">Traditional (Hong Kong)</option>
      <option value="zh-sg">Simplified (Singapore)</option>
      <option value="zh-my">Simplified (Malaysia)</option>
      <option value="zh-mo">Traditional (Macau)</option>
    </select>
  </label>
  <button id="save">Save</button>
  <script src="popup.js"></script>
</body>
</html>
